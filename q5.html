<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Assignment-1 | Q-5</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #121212;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        display: flex;
        gap: 30px;
        width: 90%;
        max-width: 1000px;
      }

      form,
      #output {
        background-color: #1c1c1c;
        padding: 20px;
        border-radius: 8px;
        width: 50%;
      }

      p {
        margin-bottom: 10px;
      }

      button {
        padding: 8px 14px;
        border: none;
        border-radius: 4px;
        background-color: #2e2e2e;
        color: #fff;
        cursor: pointer;
      }

      button:hover {
        background-color: #444;
      }

      #results {
        background-color: #131313;
        padding: 15px;
        border-radius: 6px;
        color: lightcoral;
        min-height: 300px;
        max-height: 400px;
        overflow-y: auto;
        white-space: pre-wrap;
        /* white-space : pre-wrap makes the alignment of text in the output div consistent */
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <form>
        <p>Filter all employees with salary greater than 5000</p>
        <button id="ques1">Part A</button>
        <br /><br />

        <p>Group employee on the basis of their age</p>
        <button id="ques2">Part B</button>
        <br /><br />

        <p>
          Fetch employees with salary less than 1000 and age greater than 20.
          Then give them an increment 5 times their salary.
        </p>
        <button id="ques3">Part C</button>
      </form>

      <div id="output">
        <p id="results">Output will appear here...</p>
      </div>
    </div>

    <script src="./q5.js"></script>
  </body>
</html>
